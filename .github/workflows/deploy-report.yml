name: Deploy Relatorio Quarto

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias Python minimas para renderizacao
        run: |
          python -m pip install --upgrade pip
          pip install ipykernel jupyter pandas numpy pyarrow matplotlib seaborn

      - name: Configurar Quarto CLI
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Compilar relatorio Quarto
        run: |
          quarto render report/

      - name: Deploy para GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./report/_site
